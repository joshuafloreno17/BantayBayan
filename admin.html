
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Official Login | BantayBayan</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                🏘️ BantayBayan
            </a>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#mainNavbar"
                aria-controls="mainNavbar"
                aria-expanded="false"
                aria-label="Toggle navigation"
            >
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="mainNavbar">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container py-5">
        <div class="row justify-content-center align-items-center">
            <div class="col-md-7 col-lg-5">

                <div class="info-card">
                    <div class="text-center mb-4">
                        <div class="info-icon">🛡️</div>

                        <h1 class="h3 fw-bold">Official Login</h1>

                        <p class="text-secondary mb-0">
                            Sign in to manage community reports.
                        </p>
                    </div>

                    <div
                        id="loginMessage"
                        class="alert d-none"
                        role="alert"
                    ></div>

                    <form id="loginForm">
                        <div class="mb-3">
                            <label
                                for="email"
                                class="form-label fw-semibold"
                            >
                                Email Address
                            </label>

                            <input
                                type="email"
                                id="email"
                                class="form-control"
                                autocomplete="username"
                                required
                            >
                        </div>

                        <div class="mb-4">
                            <label
                                for="password"
                                class="form-label fw-semibold"
                            >
                                Password
                            </label>

                            <div class="input-group">
                                <input
                                    type="password"
                                    id="password"
                                    class="form-control"
                                    autocomplete="current-password"
                                    required
                                >

                                <button
                                    class="btn btn-outline-primary"
                                    type="button"
                                    id="togglePassword"
                                    aria-label="Show password"
                                    aria-pressed="false"
                                >
                                    Show
                                </button>
                            </div>
                        </div>

                        <button
                            type="submit"
                            id="loginButton"
                            class="btn btn-primary btn-lg w-100"
                        >
                            Sign In
                        </button>
                    </form>

                    <p class="small text-secondary mt-3 mb-0">
                        Authorized barangay officials only.
                    </p>
                </div>

            </div>
        </div>
    </main>

    <footer class="text-center py-4">
        <div class="container">
            <p class="mb-1 fw-semibold">BantayBayan</p>

            <p class="small mb-0">
                Community Reporting and Flood Monitoring System
            </p>
        </div>
    </footer>

    <script>
        const passwordInput = document.getElementById("password");
        const togglePassword = document.getElementById("togglePassword");

        togglePassword.addEventListener("click", function () {
            const showPassword = passwordInput.type === "password";

            passwordInput.type = showPassword ? "text" : "password";
            togglePassword.textContent = showPassword ? "Hide" : "Show";

            togglePassword.setAttribute(
                "aria-label",
                showPassword ? "Hide password" : "Show password"
            );

            togglePassword.setAttribute(
                "aria-pressed",
                String(showPassword)
            );
        });
    </script>

    <script type="module" src="js/admin.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
